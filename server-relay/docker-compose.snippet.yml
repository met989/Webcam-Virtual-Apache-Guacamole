# ==============================================================================
# DOCKER COMPOSE SNIPPET FOR GUACAMOLE (or dedicated compose stack)
# ==============================================================================
# Paste this block under "services:" in your existing docker-compose.yml
# ==============================================================================

  virtualcam-relay:
    build:
      context: ./server-relay
      dockerfile: Dockerfile
    container_name: virtualcam-relay
    restart: unless-stopped
    environment:
      - PORT=9090
      - STATIC_DIR=/app/static
      # - AUTH_TOKEN=secret123 # Optional: uncomment to require an authentication token
    ports:
      # Expose only on localhost: Nginx will handle HTTPS and WebSocket reverse proxy
      - "127.0.0.1:9090:9090"
    volumes:
      # Mount static files to allow updates without rebuilding the image
      - ./server-relay/static:/app/static:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
