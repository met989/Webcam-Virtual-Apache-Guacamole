# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR VIRTUALCAM RELAY
# ==============================================================================
# Paste these location blocks inside your existing Guacamole `server { ... }` block
# (typically in /opt/guacamole/nginx.conf or /etc/nginx/sites-available/guacamole.conf)
# ==============================================================================

    # 1. Convenient redirection /cam -> /cam/
    location = /cam {
        return 301 /cam/;
    }

    # 2. Web Sender GUI (Home / Remote browser sender interface)
    location /cam/ {
        # If running virtualcam-relay natively on host and Nginx inside Docker:
        # replace with the Docker bridge gateway IP (e.g. 172.18.0.1:9090) or 127.0.0.1:9090
        proxy_pass http://127.0.0.1:9090/cam/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Encrypted High-Performance WebSocket Tunnel for Video/Audio streaming
    location /cam/ws {
        proxy_pass http://127.0.0.1:9090/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering to guarantee ultra-low latency (< 50 ms)
        proxy_buffering off;

        # Long timeouts to prevent random drops during meetings
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
